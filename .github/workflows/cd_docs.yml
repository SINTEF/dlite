name: CD - Deploy documentation to GH Pages

on:
  # Run on push/merge to master
  push:
    branches:
      - master
      - ghpagesfail
  release:
    types:
      - published
  workflow_dispatch:  # Allow to trigger the workflow manually

# Sets permissions of the GITHUB_TOKEN to allow pushing to gh-pages
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ONTODOC_DIR: doc
  BUILD_DIR: tmp
  PUBLISH_DIR: pages

jobs:
  compile-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Keep docs on a stable interpreter for current Sphinx/AutoAPI stack.
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update --fix-missing
          xargs -a .github/docker/cd_docs_apt_packages.txt sudo apt-get install -y
          #python3 -m pip install psycopg2-binary==2.9.5

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements_doc.txt -r requirements_dev.txt

      - name: Available version of installed programs
        run: |
          python --version
          swig -version
          cmake -version
          doxygen --version
          dot -V

      - name: Build and verify docs (single source of truth)
        run: |
          chmod +x tools/cd_docs_build_and_verify.sh
          BUILD_DIR="${BUILD_DIR}" tools/cd_docs_build_and_verify.sh

      - name: Determine deployment target
        run: |
          set -euo pipefail

          EVENT_NAME="${GITHUB_EVENT_NAME}"
          REF_NAME="${GITHUB_REF_NAME}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Update latest docs from master (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${REF_NAME}"
            echo "DOCS_TARGET=versions/${TAG}" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=false" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Publish docs for ${TAG}" >> "$GITHUB_ENV"
          else
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Manual docs publish (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          fi

          echo "Docs target directory: ${DOCS_TARGET:-pending}"

      - name: Checkout gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REPO_URL" gh-pages
          else
            git clone --no-checkout "$REPO_URL" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

      - name: Update docs content
        run: |
          set -euo pipefail

          if [[ -z "${DOCS_HTML_DIR:-}" ]] || [[ ! -d "${DOCS_HTML_DIR}" ]]; then
            echo "ERROR: DOCS_HTML_DIR is not set to an existing directory."
            exit 1
          fi

          mkdir -p "gh-pages/${DOCS_TARGET}"
          rsync -a --delete "${DOCS_HTML_DIR}/" "gh-pages/${DOCS_TARGET}/"

          if [[ "${COPY_TO_ROOT}" == "true" ]]; then
            rsync -a --delete \
              --exclude '.git/' \
              --exclude 'versions/' \
              --exclude 'latest/' \
              --exclude '.nojekyll' \
              --exclude 'versions.json' \
                "${DOCS_HTML_DIR}/" gh-pages/
          fi

          touch gh-pages/.nojekyll

          mkdir -p gh-pages/versions
          {
            echo "["
            find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -Vr \
              | awk 'BEGIN{first=1} {if(!first) printf ",\n"; printf "  \"%s\"", $0; first=0} END{printf "\n"}'
            echo "]"
          } > gh-pages/versions.json

          if [[ -d gh-pages/latest ]]; then
            cp gh-pages/versions.json gh-pages/latest/versions.json
          fi

          find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -print0 | \
            xargs -0 -r -I{} cp gh-pages/versions.json "{}/versions.json"

      - name: Commit and push
        run: |
          set -euo pipefail

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin gh-pages
