name: CD - Deploy documentation to GH Pages

on:
  # Run on push/merge to master
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:  # Allow to trigger the workflow manually

# Sets permissions of the GITHUB_TOKEN to allow pushing to gh-pages
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ONTODOC_DIR: doc
  BUILD_DIR: tmp
  PUBLISH_DIR: pages

jobs:
  compile-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install system dependencies
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install \
            libxml2-dev \
            libxslt-dev \
            libhdf5-dev \
            doxygen \
            graphviz \
            python3 \
            python3-pip \
            python3-dev \
            python3-numpy \
            python3-yaml
          #python3 -m pip install psycopg2-binary==2.9.5

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements_doc.txt -r requirements_dev.txt

      - name: Available version of installed programs
        run: |
          python --version
          swig -version
          cmake -version
          doxygen --version
          dot -V

      - name: Run CMAKE
        run: |
          mkdir -p build
          cd build
          Python3_ROOT=$(python3 -c 'import sys; print(sys.exec_prefix)') \
            CFLAGS='-Wno-missing-field-initializers' \
            cmake .. -DFORCE_EXAMPLES=ON -DWITH_DOC=ON

      - name: Run MakeFile
        run: make
        working-directory: build

      - name: Verify Python AutoAPI output
        run: |
          set -euo pipefail
          AUTOAPI_DIR=$(find build/doc -type d -path '*/html/autoapi' | head -n 1 || true)
          if [[ -z "${AUTOAPI_DIR}" ]]; then
            echo "ERROR: AutoAPI output directory was not found under build/doc."
            echo "---- Sphinx config excerpt ----"
            sed -n '1,260p' build/doc/_build/conf.py | grep -E 'autoapi_(dirs|ignore|file_patterns|python_use_implicit_namespaces)' || true
            echo "---- build/doc directories ----"
            find build/doc -maxdepth 4 -type d | sort
            echo "---- build/doc/html listing ----"
            ls -la build/doc/html || true
            exit 1
          fi

          echo "Using AutoAPI directory: ${AUTOAPI_DIR}"
          AUTOAPI_INDEX_COUNT=$(find "${AUTOAPI_DIR}" -type f -name index.html | wc -l)
          echo "Detected ${AUTOAPI_INDEX_COUNT} AutoAPI index page(s)."
          if [[ "${AUTOAPI_INDEX_COUNT}" -lt 1 ]]; then
            echo "ERROR: AutoAPI did not generate index pages."
            find "${AUTOAPI_DIR}" -maxdepth 4 -type f | sort | head -n 100
            exit 1
          fi

          if [[ ! -f build/doc/html/api.html ]] || ! grep -q 'autoapi/dlite/index.html' build/doc/html/api.html; then
            echo "ERROR: API landing page does not link to Python AutoAPI pages."
            echo "---- api.html excerpt ----"
            sed -n '460,620p' build/doc/html/api.html || true
            exit 1
          fi

          find "${AUTOAPI_DIR}" -maxdepth 3 -type f -name index.html | sort | head -n 20

      - name: Determine deployment target
        run: |
          set -euo pipefail

          EVENT_NAME="${GITHUB_EVENT_NAME}"
          REF_NAME="${GITHUB_REF_NAME}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Update latest docs from master (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${REF_NAME}"
            echo "DOCS_TARGET=versions/${TAG}" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=false" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Publish docs for ${TAG}" >> "$GITHUB_ENV"
          else
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Manual docs publish (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          fi

          echo "Docs target directory: ${DOCS_TARGET:-pending}"

      - name: Checkout gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REPO_URL" gh-pages
          else
            git clone --no-checkout "$REPO_URL" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

      - name: Update docs content
        run: |
          set -euo pipefail

          mkdir -p "gh-pages/${DOCS_TARGET}"
          rsync -a --delete build/doc/html/ "gh-pages/${DOCS_TARGET}/"

          if [[ "${COPY_TO_ROOT}" == "true" ]]; then
            rsync -a --delete \
              --exclude '.git/' \
              --exclude 'versions/' \
              --exclude 'latest/' \
              --exclude '.nojekyll' \
              --exclude 'versions.json' \
              build/doc/html/ gh-pages/
          fi

          touch gh-pages/.nojekyll

          mkdir -p gh-pages/versions
          {
            echo "["
            find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -Vr \
              | awk 'BEGIN{first=1} {if(!first) printf ",\n"; printf "  \"%s\"", $0; first=0} END{printf "\n"}'
            echo "]"
          } > gh-pages/versions.json

          if [[ -d gh-pages/latest ]]; then
            cp gh-pages/versions.json gh-pages/latest/versions.json
          fi

          find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -print0 | \
            xargs -0 -r -I{} cp gh-pages/versions.json "{}/versions.json"

      - name: Commit and push
        run: |
          set -euo pipefail

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin gh-pages
