name: CD - Deploy documentation to GH Pages

on:
  # Run on push/merge to master
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:  # Allow to trigger the workflow manually

# Sets permissions of the GITHUB_TOKEN to allow pushing to gh-pages
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  ONTODOC_DIR: doc
  BUILD_DIR: tmp
  PUBLISH_DIR: pages

jobs:
  compile-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"

      - name: Install system dependencies
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install \
            libxml2-dev \
            libxslt-dev \
            libhdf5-dev \
            doxygen \
            graphviz \
            python3 \
            python3-pip \
            python3-dev \
            python3-numpy \
            python3-yaml
          #python3 -m pip install psycopg2-binary==2.9.5

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements_doc.txt -r requirements_dev.txt

      - name: Available version of installed programs
        run: |
          python --version
          swig -version
          cmake -version
          doxygen --version
          dot -V

      - name: Run CMAKE
        run: |
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          cd "${BUILD_DIR}"
          Python3_ROOT=$(python3 -c 'import sys; print(sys.exec_prefix)') \
            CFLAGS='-Wno-missing-field-initializers' \
            cmake .. -DFORCE_EXAMPLES=ON -DWITH_DOC=ON

      - name: Run MakeFile
        run: make
        working-directory: ${{ env.BUILD_DIR }}

      - name: Verify Python AutoAPI output
        run: |
          set -euo pipefail
          mapfile -t DOCS_CANDIDATES < <(find . -type f -path '*/doc/html/index.html' -not -path './gh-pages/*' | sed 's#/index.html$##' | sort -u)
          if [[ "${#DOCS_CANDIDATES[@]}" -eq 0 ]]; then
            echo "ERROR: Could not locate Sphinx HTML output directory (*/doc/html)."
            echo "---- Candidate doc directories ----"
            find . -maxdepth 4 -type d -name doc | sort || true
            echo "---- Candidate html directories ----"
            find . -maxdepth 6 -type d -name html | sort || true
            exit 1
          fi

          DOCS_HTML_DIR=""
          AUTOAPI_DIR=""
          BEST_AUTOAPI_INDEX_COUNT=-1
          for CANDIDATE_DIR in "${DOCS_CANDIDATES[@]}"; do
            CANDIDATE_AUTOAPI_DIR="${CANDIDATE_DIR}/autoapi"
            CANDIDATE_AUTOAPI_INDEX_COUNT=$(find "${CANDIDATE_AUTOAPI_DIR}" -type f -name index.html 2>/dev/null | wc -l)
            echo "Candidate docs HTML directory: ${CANDIDATE_DIR} (AutoAPI index pages: ${CANDIDATE_AUTOAPI_INDEX_COUNT})"
            if [[ "${CANDIDATE_AUTOAPI_INDEX_COUNT}" -gt "${BEST_AUTOAPI_INDEX_COUNT}" ]]; then
              BEST_AUTOAPI_INDEX_COUNT="${CANDIDATE_AUTOAPI_INDEX_COUNT}"
              DOCS_HTML_DIR="${CANDIDATE_DIR}"
              AUTOAPI_DIR="${CANDIDATE_AUTOAPI_DIR}"
            fi
          done

          echo "Using docs HTML directory: ${DOCS_HTML_DIR}"
          echo "DOCS_HTML_DIR=${DOCS_HTML_DIR}" >> "$GITHUB_ENV"

          if [[ "${BEST_AUTOAPI_INDEX_COUNT}" -lt 1 ]]; then
            echo "ERROR: AutoAPI output was not found in any docs HTML directory."
            echo "---- All AutoAPI directories under workspace ----"
            find . -type d -path '*/autoapi' | sort || true
            echo "---- All AutoAPI index files under workspace ----"
            find . -type f -path '*/autoapi/*/index.html' | sort | head -n 200 || true
            echo "---- Sphinx config excerpt ----"
            find . -type f -path '*/doc/_build/conf.py' -print -exec sed -n '1,260p' {} \; | grep -E 'autoapi_(dirs|ignore|file_patterns|python_use_implicit_namespaces)' || true
            echo "---- docs HTML listing ----"
            ls -la "${DOCS_HTML_DIR}" || true
            exit 1
          fi

          echo "Using AutoAPI directory: ${AUTOAPI_DIR}"
          AUTOAPI_INDEX_COUNT="${BEST_AUTOAPI_INDEX_COUNT}"
          echo "Detected ${AUTOAPI_INDEX_COUNT} AutoAPI index page(s)."

          if [[ ! -f "${DOCS_HTML_DIR}/api.html" ]] || ! grep -Eq 'autoapi/.*/index.html' "${DOCS_HTML_DIR}/api.html"; then
            echo "ERROR: API landing page does not link to Python AutoAPI pages."
            echo "---- api.html excerpt ----"
            sed -n '460,620p' "${DOCS_HTML_DIR}/api.html" || true
            exit 1
          fi

          find "${AUTOAPI_DIR}" -maxdepth 3 -type f -name index.html | sort | head -n 20

      - name: Determine deployment target
        run: |
          set -euo pipefail

          EVENT_NAME="${GITHUB_EVENT_NAME}"
          REF_NAME="${GITHUB_REF_NAME}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Update latest docs from master (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            TAG="${REF_NAME}"
            echo "DOCS_TARGET=versions/${TAG}" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=false" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Publish docs for ${TAG}" >> "$GITHUB_ENV"
          else
            echo "DOCS_TARGET=latest" >> "$GITHUB_ENV"
            echo "COPY_TO_ROOT=true" >> "$GITHUB_ENV"
            echo "COMMIT_MESSAGE=Manual docs publish (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          fi

          echo "Docs target directory: ${DOCS_TARGET:-pending}"

      - name: Checkout gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REPO_URL" gh-pages
          else
            git clone --no-checkout "$REPO_URL" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

      - name: Update docs content
        run: |
          set -euo pipefail

          if [[ -z "${DOCS_HTML_DIR:-}" ]] || [[ ! -d "${DOCS_HTML_DIR}" ]]; then
            echo "ERROR: DOCS_HTML_DIR is not set to an existing directory."
            exit 1
          fi

          mkdir -p "gh-pages/${DOCS_TARGET}"
          rsync -a --delete "${DOCS_HTML_DIR}/" "gh-pages/${DOCS_TARGET}/"

          if [[ "${COPY_TO_ROOT}" == "true" ]]; then
            rsync -a --delete \
              --exclude '.git/' \
              --exclude 'versions/' \
              --exclude 'latest/' \
              --exclude '.nojekyll' \
              --exclude 'versions.json' \
                "${DOCS_HTML_DIR}/" gh-pages/
          fi

          touch gh-pages/.nojekyll

          mkdir -p gh-pages/versions
          {
            echo "["
            find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -Vr \
              | awk 'BEGIN{first=1} {if(!first) printf ",\n"; printf "  \"%s\"", $0; first=0} END{printf "\n"}'
            echo "]"
          } > gh-pages/versions.json

          if [[ -d gh-pages/latest ]]; then
            cp gh-pages/versions.json gh-pages/latest/versions.json
          fi

          find gh-pages/versions -mindepth 1 -maxdepth 1 -type d -print0 | \
            xargs -0 -r -I{} cp gh-pages/versions.json "{}/versions.json"

      - name: Commit and push
        run: |
          set -euo pipefail

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "${COMMIT_MESSAGE}"
          git push origin gh-pages
