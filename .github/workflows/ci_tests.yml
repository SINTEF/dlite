name: CI tests

# This CI builds DLite and runs (almost) all tests.
#
# The services needed by the storage plugin tests (postgresql, redis,
# minio and mongodb) are started from test-services/compose.yaml, so
# that CI and local testing use the same configuration.  The tests
# connect to them with the default credentials defined in
# bindings/python/testutils.py.  These are only used for throw-away
# containers that are reachable from the runner itself.

on: [push]

jobs:

  # Pull the Docker images of the test services once and store them with
  # actions/cache, such that the pytest jobs don't pull from Docker Hub,
  # whose rate limit for anonymous pulls may otherwise make CI fail.
  # The cache key changes when the image tags in compose.yaml change.
  docker-images:
    name: Cache Docker images for test services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout tripper
      uses: actions/checkout@v7

    - name: Look up cached Docker images
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/docker-images.tar
        key: docker-images-${{ hashFiles('test-services/compose.yaml') }}
        lookup-only: true

    - name: Pull and save Docker images
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        images=$(docker compose -f test-services/compose.yaml config --images)
        for image in $images; do
          for attempt in 1 2 3 4 5; do
            docker pull "$image" && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            echo "Pull of $image failed, retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
        done
        docker save -o ~/docker-images.tar $images

  test:
    needs: docker-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Restore Docker images
        uses: actions/cache/restore@v6
        with:
          path: ~/docker-images.tar
          key: docker-images-${{ hashFiles('test-services/compose.yaml') }}
          fail-on-cache-miss: true

      - name: Load Docker images
        run: docker load -i ~/docker-images.tar

      - name: Start services
        run: |
          docker compose -f test-services/compose.yaml up -d --wait --pull never

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run build_and_test.sh from the checked-out repo instead of the copy
      # baked into the image, so changes to the script are tested without
      # having to rebuild the image first.
      - name: Run tests inside the container
        run: |
          docker run --rm \
            --volume $PWD:/io \
            --network=host \
            ghcr.io/sintef/dlite/ubuntu_x86_64:latest \
            bash /io/.github/docker/build_and_test.sh

      - name: Show service logs
        if: failure()
        run: docker compose -f test-services/compose.yaml logs

      - name: Stop services
        if: always()
        run: docker compose -f test-services/compose.yaml down
