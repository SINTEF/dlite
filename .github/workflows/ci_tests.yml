name: CI tests

# This CI builds DLite and runs (almost) all tests.
#
# The services needed by the storage plugin tests (postgresql, redis,
# minio and mongodb) are started from test-services/compose.yaml, so
# that CI and local testing use the same configuration.  The tests
# connect to them with the default credentials defined in
# bindings/python/testutils.py.  These are only used for throw-away
# containers that are reachable from the runner itself.

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Start services
        run: |
          docker compose -f test-services/compose.yaml up -d --wait \
            postgres redis minio mongodb

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run build_and_test.sh from the checked-out repo instead of the copy
      # baked into the image, so changes to the script are tested without
      # having to rebuild the image first.
      - name: Run tests inside the container
        run: |
          docker run --rm \
            --volume $PWD:/io \
            --network=host \
            ghcr.io/sintef/dlite/ubuntu_x86_64:latest \
            bash /io/.github/docker/build_and_test.sh

      - name: Show service logs
        if: failure()
        run: docker compose -f test-services/compose.yaml logs

      - name: Stop services
        if: always()
        run: docker compose -f test-services/compose.yaml down
