name: CD - Publish a new release

on:
  release:
    types:
    - published
  workflow_dispatch:  # Allow to trigger the workflow manually

env:
  PUBLISH_UPDATE_BRANCH: master
  GIT_USER_NAME: "TEAM 4.0[bot]"
  GIT_USER_EMAIL: "Team4.0@SINTEF.no"
  CONTAINER_REGISTRY: ghcr.io

jobs:
  update_version:
    name: Update DLite version and release body
    runs-on: ubuntu-24.04
    if: github.repository == 'SINTEF/dlite' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ env.PUBLISH_UPDATE_BRANCH }}
        token: ${{ secrets.RELEASE_PAT }}

    - name: Set up git user
      run: |
        git config --global user.name "${GIT_USER_NAME}"
        git config --global user.email "${GIT_USER_EMAIL}"

    - name: Extract version number from GITHUB_REF
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        if [ "${VERSION:0:1}" = "v" ]; then VERSION=${VERSION#v}; fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Update version
      shell: bash
      run: |
        echo "VERSION=${VERSION}"

        sed -i "s/^ *VERSION  *[0-9][^ ]* *$/  VERSION ${VERSION}/" CMakeLists.txt

        if [ -n "$(git status --porcelain  -uno)" ]; then
          git add CMakeLists.txt
          git commit -m "Release ${VERSION}"

          # TAG is already added by github
          #TAG_MSG=.github/utils/release_tag_msg.txt
          #sed -i "s|TAG_NAME|${GITHUB_REF#refs/tags/}|" "${TAG_MSG}"
          #git tag -af -F "${TAG_MSG}" ${GITHUB_REF#refs/tags/}
          #git push --tags origin ${{ env.PUBLISH_UPDATE_BRANCH }}
          git push origin ${{ env.PUBLISH_UPDATE_BRANCH }}
        fi

    #- name: Update '${{ env.PUBLISH_UPDATE_BRANCH }}'
    #  uses: CasperWA/push-protected@v2
    #  with:
    #    token: ${{ secrets.RELEASE_PAT }}
    #    branch: ${{ env.PUBLISH_UPDATE_BRANCH }}
    #    sleep: 15
    #    force: true
    #    tags: true
    #    unprotect_reviews: true

    - name: Get tagged versions
      run: echo "PREVIOUS_VERSION=$(git tag -l --sort -version:refname | sed -n 2p)" >> $GITHUB_ENV

    - name: Create release-specific changelog
      uses: CharMixer/auto-changelog-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        release_branch: ${{ env.PUBLISH_UPDATE_BRANCH }}
        since_tag: "${{ env.PREVIOUS_VERSION }}"
        output: "release_changelog.md"

    - name: Append changelog to release body
      run: |
        gh api /repos/${{ github.repository }}/releases/${{ github.event.release.id }} --jq '.body' > release_body.md
        cat release_changelog.md >> release_body.md
        gh api /repos/${{ github.repository }}/releases/${{ github.event.release.id }} -X PATCH -F body='@release_body.md'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cd_build_wheels:
    name: Build wheels
    if: github.repository == 'SINTEF/dlite' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/reusable_build_wheels.yml
    with:
      container_registry: ghcr.io
      update_version_from_tag: true
      upload_artifacts: true
      artifact_name_prefix: wheels
      matrix_json: >-
        [
          {"os":"ubuntu-24.04","system_type":["manylinux","_2_28"],"arch":"x86_64","py_minors":"8,9,10,11,12,13,14"},
          {"os":"ubuntu-24.04","system_type":["musllinux","_1_2"],"arch":"x86_64","py_minors":"8,9,10,11,12,13,14"},
          {"os":"ubuntu-24.04","system_type":["manylinux","2014"],"arch":"i686","py_minors":"10,11,12,13,14"},
          {"os":"ubuntu-24.04","system_type":["musllinux","_1_2"],"arch":"i686","py_minors":"9,10,11"},
          {"os":"windows-2022","system_type":["win",""],"arch":"amd64","py_minors":"8,9,10,11,12,13,14"},
          {"os":"macos-14","system_type":["macosx",""],"arch":"arm64","py_minors":"8,9,10,11,12,13,14","deployment-target":"11.0"}
        ]

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    if: github.repository == 'SINTEF/dlite' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # This step is necessary because while this is done in the job above,
    # this job runs with the original commit SHA and does not have this change.
    # And to avoid checking out `master` (should someone push in-between all this),
    # this seems like the most low-tech solution (instead of caching/using artifacts):
    # Change the version in CMakeList.txt and build wheels
    - name: Update version
      shell: bash
      run: |
        python - <<'PY'
        import re, os, pathlib

        version = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
        p = pathlib.Path("CMakeLists.txt")
        txt = p.read_text()

        new = re.sub(r'(?m)^( +VERSION +)[0-9.]+$', r'\g<1>' + version, txt)
        if new == txt:
            raise SystemExit("VERSION line not updated (pattern did not match)")

        p.write_text(new)
        print("Updated VERSION to", version)
        PY

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13.5"

    - name: Install Python dependencies
      run: |
        python -m pip install pip
        pip install build

        # Build requirements
        pip install -r requirements.txt -r requirements_dev.txt

    - name: Build source distribution
      run: python -m build --no-isolation --sdist python

    - name: Store sdist for publishing
      uses: actions/upload-artifact@v7
      with:
        # Note that they are moved to a common directory sdist_____ (5 underscores, as in the name below)
        name: sdist_${{ matrix.os }}_${{ matrix.system_type[0] }}_${{ matrix.system_type[1] }}_${{ matrix.arch }}_${{ matrix.py_minors }}
        path: python/dist/*

  publish:
    needs: [cd_build_wheels,build_sdist]
    name: Publish DLite distributions
    runs-on: ubuntu-24.04
    permissions:
      id-token: write

    steps:
    - name: Retrieve wheels and sdist
      uses: actions/download-artifact@v8
      with:
        path: dist/

    - name: Move sdists and wheels to dist and remove all directories
      run: |
        ls -lah dist
        mv dist/sdist_____/* dist/
        mv dist/wheels*/* dist/
        cd dist
        find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
        cd ..
        ls -lah dist

    # - name: Publish package to Test PyPI
    #   uses: pypa/gh-action-pypi-publish@release/v1
    #   with:
    #     user: __token__
    #     password: ${{ secrets.TEST_PYPI_TOKEN }}
    #     repository-url: https://test.pypi.org/legacy/

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
