version: 2
updates:

# GitHub Actions used in the workflows.  All updates are collected in
# one PR per week.
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:30"
  groups:
    github-actions:
      patterns: ["*"]
  labels:
    - CI/CD

# Python dependencies in the requirements*.txt files in the root of the
# repository.  Version ranges are only widened when a new release falls
# outside them.  All updates are collected in one PR per week.
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "05:30"
  versioning-strategy: increase-if-necessary
  groups:
    python-dependencies:
      patterns: ["*"]
  labels:
    - CI/CD
